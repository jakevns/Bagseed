<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bagseed · T-shirt arm</title>
<style>body{background:#211d28;color:#eee8dc;font:16px system-ui;margin:24px}button,select{font:inherit;padding:8px;margin:5px}.pair{display:flex;flex-wrap:wrap;gap:20px}canvas{width:288px;max-width:100%;background:#292330}h1{font-size:24px}</style>
<h1>T-shirt arm correction</h1><p>The back now covers the far shoulder, sleeve and upper arm. Only the exposed forearm and hand show beyond the torso silhouette.</p><select id="dir"><option>right</option><option>left</option><option>down</option><option>up</option></select><button id="play">Pause</button><button id="slow">Slow motion</button><span id="count"></span><div id="steps"></div>
<div class="pair"><section><h2>Previous T-shirt</h2><canvas id="before" width="288" height="432"></canvas></section><section><h2>Corrected T-shirt</h2><canvas id="after" width="288" height="432"></canvas></section><section><h2>Approved arm reference</h2><canvas id="reference" width="288" height="432"></canvas></section></div>
<script>
const images={},dir=document.querySelector('#dir');let f=0,playing=true,slow=false,last=0;for(const side of ['before','after'])for(const d of ['down','right','up','left']){const im=new Image();images[side+d]=im;im.onload=draw;im.src=side+'-'+d+'.png';}
function draw(){['before','after','reference'].forEach((id,i)=>{const c=document.querySelector('#'+id),g=c.getContext('2d'),im=images[(i?'after':'before')+dir.value];g.clearRect(0,0,288,432);if(im.complete&&im.naturalWidth)g.drawImage(im,f*288,i===2?432:0,288,432,0,0,288,432);});document.querySelector('#count').textContent='Pose '+(f+1)+' / 8';}
for(let i=0;i<8;i++){const b=document.createElement('button');b.textContent=i+1;b.onclick=()=>{f=i;playing=false;document.querySelector('#play').textContent='Play';draw();};document.querySelector('#steps').append(b);}dir.onchange=draw;document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause':'Play';};document.querySelector('#slow').onclick=e=>{slow=!slow;e.target.textContent=slow?'Normal speed':'Slow motion';};function tick(t){if(playing&&t-last>=(slow?400:125)){last=t;f=(f+1)%8;draw();}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script>
