<section id="bagseed-loading" aria-label="Loading Bagseed" aria-busy="true">
  <header class="loading-heading"><h1>Bagseed</h1><p class="loading-tagline">Your room. Your rules.</p></header>
  <div class="loading-room"><canvas id="bagseed-loading-room" width="1600" height="600" aria-label="An illustrated view of the Bagseed bedroom, changing from day to night"></canvas></div>
  <div class="loading-panel">
    <div class="loading-track" role="progressbar" aria-label="Loading game artwork"><span></span></div>
    <div role="status" aria-live="polite" aria-atomic="true"><p id="bagseed-loading-status">Getting your room ready…</p><p id="bagseed-loading-detail">A little room to grow.</p></div>
    <button id="bagseed-loading-reload" type="button" hidden>Reload</button>
    <noscript><style>#bagseed-loading .loading-track,#bagseed-loading-status,#bagseed-loading-detail{display:none}</style><p>Enable JavaScript to play Bagseed.</p></noscript>
  </div>
</section>
